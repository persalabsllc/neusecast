<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: transparent; }
    .top { position: absolute; inset: 34px 42px auto 42px; display: flex; align-items: flex-start; justify-content: space-between; filter: drop-shadow(0 3px 8px #000b); }
    .conditions { min-width: 330px; display: flex; align-items: center; gap: 18px; padding: 13px 22px; border: 1px solid #c5e7e533; border-radius: 12px; background: #06151ded; color: #eaf9f8; }
    .conditions[hidden], .clock[hidden], .brand[hidden], .ticker[hidden] { display: none; }
    .temperature { font-size: 42px; line-height: 1; font-weight: 800; color: #69d5c7; }
    .condition-copy strong, .condition-copy span { display: block; }
    .condition-copy strong { font-size: 20px; letter-spacing: .01em; }
    .condition-copy span { margin-top: 4px; color: #a8c6c8; font-size: 15px; text-transform: uppercase; letter-spacing: .12em; }
    .clock { margin-left: 10px; padding: 16px 20px; border-radius: 12px; background: #06151ded; color: #fff; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .brand { display: flex; align-items: center; min-height: 64px; padding: 12px 20px; border-radius: 12px; background: #06151ded; color: #e8fbf8; font-size: 25px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .brand img { display: none; max-width: 250px; max-height: 58px; object-fit: contain; }
    .brand.has-image img { display: block; }
    .brand.has-image span { display: none; }
    .ticker { position: absolute; inset: auto 0 0; height: 76px; overflow: hidden; border-top: 3px solid #4bc8b6; background: #06131df5; color: #eefaf9; }
    .ticker-label { position: absolute; z-index: 2; inset: 0 auto 0 0; width: 205px; display: grid; place-items: center; background: #4bc8b6; color: #041315; font-size: 22px; font-weight: 900; letter-spacing: .11em; }
    .ticker-track { position: absolute; left: 205px; top: 0; height: 73px; display: flex; align-items: center; width: max-content; animation: crawl var(--crawl-seconds, 45s) linear infinite; }
    .ticker-track span { display: block; padding-left: 70px; white-space: nowrap; font-size: 27px; font-weight: 600; letter-spacing: .01em; }
    @keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  </style>
</head>
<body>
  <div class="top">
    <div style="display:flex;align-items:flex-start">
      <div class="conditions" id="weather">
        <div class="temperature" id="temperature">--°</div>
        <div class="condition-copy"><strong id="condition">Eastern Carolina</strong><span id="location">New Bern</span></div>
      </div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div class="brand" id="brand"><img id="logoImage" alt=""><span id="logoLabel">NEUSECAST</span></div>
  </div>
  <div class="ticker" id="ticker">
    <div class="ticker-label">NEUSECAST</div>
    <div class="ticker-track" id="tickerTrack"><span id="tickerA"></span><span id="tickerB"></span></div>
  </div>
  <script>
    (() => {
      const state = { timeZone: "America/New_York", serverOffset: 0 };
      const byId = (id) => document.getElementById(id);
      const truthy = (value) => value === true || value === "true" || value === "1";
      const readData = (xml) => {
        const result = {};
        const documentNode = new DOMParser().parseFromString(String(xml || ""), "text/xml");
        for (const component of documentNode.querySelectorAll("componentData")) {
          result[component.getAttribute("id")] = component.querySelector("data")?.getAttribute("value") || "";
        }
        return result;
      };
      const setVisible = (id, visible) => { byId(id).hidden = !truthy(visible); };
      const renderClock = () => {
        try {
          byId("clock").textContent = new Intl.DateTimeFormat("en-US", { timeZone: state.timeZone, hour: "numeric", minute: "2-digit" }).format(new Date(Date.now() + state.serverOffset));
        } catch { byId("clock").textContent = "--:--"; }
      };
      window.update = (xml) => {
        const data = readData(xml);
        setVisible("weather", data.weatherVisible);
        setVisible("clock", data.clockVisible);
        setVisible("brand", data.logoVisible);
        setVisible("ticker", data.tickerVisible);
        byId("temperature").textContent = data.temperature || "--°";
        byId("condition").textContent = data.condition || "Eastern Carolina";
        byId("location").textContent = data.location || "New Bern";
        byId("logoLabel").textContent = data.logoLabel || "NEUSECAST";
        state.timeZone = data.timeZone || "America/New_York";
        const serverTime = Number(data.serverTimeMs);
        state.serverOffset = Number.isFinite(serverTime) ? serverTime - Date.now() : 0;
        const logoUrl = String(data.logoUrl || "");
        const safeLogo = /^https:\/\//i.test(logoUrl);
        byId("logoImage").src = safeLogo ? logoUrl : "";
        byId("brand").classList.toggle("has-image", safeLogo);
        const tickerText = data.tickerText || "";
        byId("tickerA").textContent = tickerText;
        byId("tickerB").textContent = tickerText;
        const speed = Math.max(15, Math.min(180, Number(data.tickerSpeedSeconds) || 45));
        const track = byId("tickerTrack");
        track.style.setProperty("--crawl-seconds", `${speed}s`);
        track.style.animation = "none";
        void track.offsetWidth;
        track.style.animation = "";
        renderClock();
      };
      window.play = () => {};
      window.stop = () => {
        document.body.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: "forwards" });
      };
      renderClock();
      setInterval(renderClock, 1000);
    })();
  </script>
</body>
</html>
